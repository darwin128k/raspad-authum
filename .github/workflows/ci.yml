name: CI

on:
  push:
    branches:
      - master
      - '4.0.0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux32:
    name: Linux i386 package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install i386 toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib cmake ninja-build zip \
            libc6-dev:i386 libstdc++-12-dev:i386

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAUTHUM_LH_LINK_MODE=needed

      - name: Build
        run: cmake --build build --target authum.so -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure || true

      - name: Pack game-library layout
        run: |
          strip --strip-unneeded build/authum.so
          rm -rf dist && mkdir -p dist/addons/authum/configs dist/addons/authum/modules
          cp build/authum.so dist/addons/authum/authum.so
          printf 'dlls/cs.so\n' > dist/addons/authum/gamedll.txt
          cp deploy/configs/modules.list dist/addons/authum/configs/modules.list
          cp deploy/configs/authum.cfg dist/addons/authum/configs/authum.cfg
          cat > dist/addons/authum/INSTALL.txt <<'EOF'
          Unpack into the game dir (cstrike/ or mod root) so you get:

            addons/authum/authum.so          the game library itself
            addons/authum/gamedll.txt        the real game library (dlls/cs.so)
            addons/authum/configs/modules.list   (which modules to load)
            addons/authum/configs/authum.cfg     (log levels; logs go to addons/authum/logs/)

          In liblist.gam point the engine at Authum:
            gamedll_linux "addons/authum/authum.so"

          Each module is a folder addons/authum/modules/<name>/ (<name>.so, configs/,
          lang/, data/); list it in configs/modules.list.
          EOF
          # strip leading spaces from heredoc if any
          sed -i 's/^          //' dist/addons/authum/INSTALL.txt
          (cd dist && zip -r ../authum-linux32.zip addons)
          ls -la authum-linux32.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: authum-linux32
          path: authum-linux32.zip
          if-no-files-found: error
