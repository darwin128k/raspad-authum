name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux32:
    name: Linux i386 package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Metamod-P + HLSDK
        run: |
          git clone --depth 1 --branch v1.21p109 \
            https://github.com/Bots-United/metamod-p.git lib/metamod-p

      - name: Install i386 toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib cmake ninja-build zip \
            libc6-dev:i386 libstdc++-12-dev:i386

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAUTHUM_LH_LINK_MODE=needed

      - name: Build
        run: cmake --build build --target authum_mm.so -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure || true

      - name: Pack Metamod layout
        run: |
          strip --strip-unneeded build/authum_mm.so
          rm -rf dist && mkdir -p dist/addons/authum
          cp build/authum_mm.so dist/addons/authum/authum_mm.so
          cp deploy/modules.list dist/addons/authum/modules.list
          cat > dist/addons/authum/INSTALL.txt <<'EOF'
          Unpack into the game dir (cstrike/ or mod root) so you get:

            addons/authum/authum_mm.so
            addons/authum/modules.list

          In addons/metamod/plugins.ini add:
            linux addons/authum/authum_mm.so

          Drop Authum modules under addons/authum/modules/<name>/ and list them in modules.list.
          EOF
          # strip leading spaces from heredoc if any
          sed -i 's/^          //' dist/addons/authum/INSTALL.txt
          (cd dist && zip -r ../authum-linux32-metamod.zip addons)
          ls -la authum-linux32-metamod.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: authum-linux32-metamod
          path: authum-linux32-metamod.zip
          if-no-files-found: error
