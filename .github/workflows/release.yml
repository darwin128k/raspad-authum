name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (e.g. v2.0.0)'
        required: true
        type: string
      ref:
        description: 'Git ref to build (branch or SHA)'
        required: true
        default: master
        type: string

permissions:
  contents: write

jobs:
  linux32:
    name: Build and publish Metamod zip
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Metamod-P + HLSDK
        run: |
          git clone --depth 1 --branch v1.21p109 \
            https://github.com/Bots-United/metamod-p.git lib/metamod-p

      - name: Install i386 toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib cmake ninja-build zip \
            libc6-dev:i386 libstdc++-12-dev:i386

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAUTHUM_LH_LINK_MODE=needed

      - name: Build
        run: cmake --build build --target authum_mm.so -j"$(nproc)"

      - name: Pack Metamod layout
        run: |
          strip --strip-unneeded build/authum_mm.so
          rm -rf dist && mkdir -p dist/addons/authum/configs dist/addons/authum/modules
          cp build/authum_mm.so dist/addons/authum/authum_mm.so
          cp deploy/configs/modules.list dist/addons/authum/configs/modules.list
          cp deploy/configs/authum.cfg dist/addons/authum/configs/authum.cfg
          cat > dist/addons/authum/INSTALL.txt <<'EOF'
          Unpack into the game dir (cstrike/ or mod root) so you get:

            addons/authum/authum_mm.so
            addons/authum/configs/modules.list   (which modules to load)
            addons/authum/configs/authum.cfg     (log levels; logs go to addons/authum/logs/)

          In addons/metamod/plugins.ini add:
            linux addons/authum/authum_mm.so

          Put modules in addons/authum/modules/<name>.so, their configs in
          addons/authum/configs/, and list them in configs/modules.list.
          EOF
          sed -i 's/^          //' dist/addons/authum/INSTALL.txt
          (cd dist && zip -r ../authum-linux32-metamod.zip addons)

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          NOTES=$(mktemp)
          python3 scripts/release_notes.py --tag "$TAG" \
            --package "Download **\`authum-linux32-metamod.zip\`** and unpack into the game dir → \`addons/authum/\`." \
            --highlight "Metamod host for classic HLDS (i386) — authum_mm.so + modules.list" \
            --highlight "Module ABI 0.3: sandbox, events, console commands" \
            --highlight "SQL / JSON helpers for modules" \
            > "$NOTES"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
          else
            gh release edit "$TAG" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" authum-linux32-metamod.zip --clobber
