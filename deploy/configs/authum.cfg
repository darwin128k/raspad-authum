# Authum settings — addons/authum/configs/authum.cfg. Lines: key = value; # or ; starts a comment.
# Read when the server starts and again on every map change.

# --- Logging -------------------------------------------------------------------
# Every module writes to its own folder, one file per day:
#   addons/authum/modules/<module>/logs/YYYY-MM-DD.log
# Authum's own lines go to addons/authum/logs/, together with every module's
# warnings and errors (tagged [module]), so one file shows all problems.
#
# Levels, quietest to loudest:
#   emergency alert critical error warning notice info debug   (or: off)

# What reaches the log files.
log_level = info

# What also goes to the server console.
log_console = warning

# Delete daily log files older than this many days (0 = keep everything).
log_keep_days = 30

# One module louder or quieter than the rest, by its name in `authum status`:
# qproto.log_level = debug
# authum.log_level = info
#
# A module can keep extra journals (modules/<module>/logs/<journal>/YYYY-MM-DD.log);
# they follow the module's level unless set:
# qproto.bans.log_level = info
